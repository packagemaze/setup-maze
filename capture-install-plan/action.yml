name: Capture native install plan
description: Record the native package client's dry run for this Project, commit, and authenticated PackageMaze Run.
inputs:
  organization:
    description: PackageMaze Organization ID.
    required: true
  project:
    description: PackageMaze Project number.
    required: true
  feed:
    description: Organization/Feed that granted this job its install sign-in.
    required: true
  client:
    description: Native package client installed in this job.
    required: true
  project-path:
    description: Project directory relative to the repository root.
    default: "."
  manifest:
    description: Explicit repository-relative Project or requirements file.
    required: false
  lock:
    description: Explicit repository-relative governing lockfile.
    required: false
  profile:
    description: Optional JSON object with defaultGroups, groups, allExtras or extras, where supported by the client.
    default: "{}"
  api-url:
    description: PackageMaze API origin for this environment.
    default: https://api.packagemaze.com
runs:
  using: node24
  main: main.mjs
