name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to cut from main (v*); the tag is created by the release itself"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Cut the release from main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            printf 'setup-maze releases must run from main, not %s\n' "$GITHUB_REF" >&2
            exit 1
          fi
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) printf 'setup-maze release tags must look like v1.2.3: %s\n' "$RELEASE_TAG" >&2; exit 1 ;;
          esac
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > /dev/null 2>&1; then
            printf 'tag %s already exists\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "setup-maze ${RELEASE_TAG}" \
            --generate-notes
