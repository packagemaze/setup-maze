name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Create fake release assets
        run: |
          set -euo pipefail
          mkdir -p fake-release fake-bin
          cp test/fixtures/maze-v0.0.4 fake-bin/maze
          chmod +x fake-bin/maze
          tar -C fake-bin -czf fake-release/maze_linux_amd64.tar.gz maze
          (cd fake-release && shasum -a 256 maze_linux_amd64.tar.gz > maze_checksums.txt)

      - name: Serve fake release assets
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory fake-release &
          printf '%s\n' "$!" > fake-release-server.pid
          sleep 1

      - id: install_only
        uses: ./
        with:
          release-base-url: http://127.0.0.1:8765

      - name: Check install-only outputs
        env:
          BINARY: ${{ steps.install_only.outputs.binary }}
          BUILD_NUMBER: ${{ steps.install_only.outputs.build_number }}
          BUILD_URL: ${{ steps.install_only.outputs.build_url }}
          INSTALL_PATH: ${{ steps.install_only.outputs.path }}
          TOKEN: ${{ steps.install_only.outputs.token }}
        run: |
          set -euo pipefail
          test -x "$BINARY"
          test -z "$BUILD_NUMBER"
          test -z "$BUILD_URL"
          test -d "$INSTALL_PATH"
          test -z "$TOKEN"
          maze auth exchange-oidc --help

      - id: install_token
        uses: ./
        with:
          release-base-url: http://127.0.0.1:8765
          feed: org/feed

      - name: Check install token output
        env:
          BUILD_NUMBER: ${{ steps.install_token.outputs.build_number }}
          BUILD_URL: ${{ steps.install_token.outputs.build_url }}
          TOKEN: ${{ steps.install_token.outputs.token }}
        run: |
          set -euo pipefail
          test "$BUILD_NUMBER" = "482"
          test "$BUILD_URL" = "https://www.packagemaze.com/org/builds/482"
          test "$TOKEN" = "fake-install-token"

      - id: publish_token
        uses: ./
        with:
          release-base-url: http://127.0.0.1:8765
          feed: org/feed
          purpose: publish
          package: "@scope/package"

      - name: Check publish token output
        env:
          BUILD_NUMBER: ${{ steps.publish_token.outputs.build_number }}
          BUILD_URL: ${{ steps.publish_token.outputs.build_url }}
          TOKEN: ${{ steps.publish_token.outputs.token }}
        run: |
          set -euo pipefail
          test "$BUILD_NUMBER" = "482"
          test "$BUILD_URL" = "https://www.packagemaze.com/org/builds/482"
          test "$TOKEN" = "fake-publish-token"

      - id: legacy_build_install
        uses: ./
        with:
          release-base-url: http://127.0.0.1:8765
          feed: org/legacy-build

      - name: Check older server omits ordinary Build outputs cleanly
        env:
          BUILD_NUMBER: ${{ steps.legacy_build_install.outputs.build_number }}
          BUILD_URL: ${{ steps.legacy_build_install.outputs.build_url }}
          TOKEN: ${{ steps.legacy_build_install.outputs.token }}
        run: |
          set -euo pipefail
          test -z "$BUILD_NUMBER"
          test -z "$BUILD_URL"
          test "$TOKEN" = "fake-legacy-install-token"

      - id: invalid_publish_missing_inputs
        uses: ./
        continue-on-error: true
        with:
          release-base-url: http://127.0.0.1:8765
          purpose: publish

      - name: Check publish validation requires feed and package
        env:
          OUTCOME: ${{ steps.invalid_publish_missing_inputs.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure"

      - id: invalid_publish_missing_package
        uses: ./
        continue-on-error: true
        with:
          release-base-url: http://127.0.0.1:8765
          feed: org/feed
          purpose: publish

      - name: Check publish validation requires package
        env:
          OUTCOME: ${{ steps.invalid_publish_missing_package.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure"

      - id: docker_token
        uses: ./
        with:
          release-base-url: http://127.0.0.1:8765
          feed: org/feed
          purpose: docker-build

      - name: Check Docker secret outputs
        env:
          BUILD_NUMBER: ${{ steps.docker_token.outputs.build_number }}
          BUILD_URL: ${{ steps.docker_token.outputs.build_url }}
          SECRET_ARGS: ${{ steps.docker_token.outputs.secret_args }}
          SECRET_FILES: ${{ steps.docker_token.outputs.secret_files }}
          SECRET_ID: ${{ steps.docker_token.outputs.secret_id }}
          SECRET_PATH: ${{ steps.docker_token.outputs.secret_path }}
          TOKEN: ${{ steps.docker_token.outputs.token }}
        run: |
          set -euo pipefail
          test "$BUILD_NUMBER" = "482"
          test "$BUILD_URL" = "https://www.packagemaze.com/org/builds/482"
          test -z "$TOKEN"
          test "$SECRET_ID" = "packagemaze_npm"
          test -n "$SECRET_ARGS"
          test -f "$SECRET_PATH"
          test "${SECRET_FILES#packagemaze_npm=}" = "$SECRET_PATH"
          grep -q "fake-docker-token" "$SECRET_PATH"
          grep -q "registry=https://pkg.packagemaze.com/org/feed/" "$SECRET_PATH"
          ! grep -Fq "$BUILD_URL" "$SECRET_PATH"
          ! grep -q "MAZE_BUILD_NUMBER" "$SECRET_PATH"
          ! grep -q "MAZE_BUILD_URL" "$SECRET_PATH"
          ! grep -q "MAZE_TOKEN" "$SECRET_PATH"
          ! grep -q "COREPACK_NPM_TOKEN" "$SECRET_PATH"
          (
            . "$SECRET_PATH"
            test -z "${MAZE_BUILD_NUMBER:-}"
            test -z "${MAZE_BUILD_URL:-}"
            test -z "${MAZE_TOKEN:-}"
            test -f "$NPM_CONFIG_USERCONFIG"
            grep -q "registry=https://pkg.packagemaze.com/org/feed/" "$NPM_CONFIG_USERCONFIG"
            grep -q "fake-docker-token" "$NPM_CONFIG_USERCONFIG"
            test "$COREPACK_NPM_REGISTRY" = "https://pkg.packagemaze.com/org/feed/"
            test -z "${COREPACK_NPM_TOKEN:-}"
          )

      - id: legacy_build_docker
        uses: ./
        with:
          release-base-url: http://127.0.0.1:8765
          feed: org/legacy-build
          purpose: docker-build

      - name: Check older server omits Docker Build outputs cleanly
        env:
          BUILD_NUMBER: ${{ steps.legacy_build_docker.outputs.build_number }}
          BUILD_URL: ${{ steps.legacy_build_docker.outputs.build_url }}
          SECRET_PATH: ${{ steps.legacy_build_docker.outputs.secret_path }}
        run: |
          set -euo pipefail
          test -z "$BUILD_NUMBER"
          test -z "$BUILD_URL"
          test -f "$SECRET_PATH"
          ! grep -q "MAZE_BUILD_NUMBER" "$SECRET_PATH"
          ! grep -q "MAZE_BUILD_URL" "$SECRET_PATH"

      - id: server_build_values
        uses: ./
        with:
          release-base-url: http://127.0.0.1:8765
          feed: org/mismatched-build
          purpose: docker-build

      - name: Check Docker exchange trusts server Build outputs
        env:
          BUILD_NUMBER: ${{ steps.server_build_values.outputs.build_number }}
          BUILD_URL: ${{ steps.server_build_values.outputs.build_url }}
          SECRET_PATH: ${{ steps.server_build_values.outputs.secret_path }}
        run: |
          set -euo pipefail
          test "$BUILD_NUMBER" = "not-a-number"
          test "$BUILD_URL" = "https://www.packagemaze.com/org/builds/482"
          test -f "$SECRET_PATH"

      - id: server_partial_build_values
        uses: ./
        with:
          release-base-url: http://127.0.0.1:8765
          feed: org/incomplete-build
          purpose: docker-build

      - name: Check Docker exchange passes through partial server Build outputs
        env:
          BUILD_NUMBER: ${{ steps.server_partial_build_values.outputs.build_number }}
          BUILD_URL: ${{ steps.server_partial_build_values.outputs.build_url }}
          SECRET_PATH: ${{ steps.server_partial_build_values.outputs.secret_path }}
        run: |
          set -euo pipefail
          test "$BUILD_NUMBER" = "482"
          test -z "$BUILD_URL"
          test -f "$SECRET_PATH"

      - id: invalid_docker_token_secret_id
        uses: ./
        continue-on-error: true
        with:
          release-base-url: http://127.0.0.1:8765
          feed: org/feed
          purpose: docker-build
          secret-id: packagemaze_npm_token

      - name: Check Docker secret id validation rejects token-looking ids
        env:
          OUTCOME: ${{ steps.invalid_docker_token_secret_id.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure"

      - id: invalid_docker_upper_token_secret_id
        uses: ./
        continue-on-error: true
        with:
          release-base-url: http://127.0.0.1:8765
          feed: org/feed
          purpose: docker-build
          secret-id: packagemaze_npm_TOKEN

      - name: Check Docker secret id validation rejects uppercase token ids
        env:
          OUTCOME: ${{ steps.invalid_docker_upper_token_secret_id.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure"

      - id: invalid_docker_upper_custom_secret_id
        uses: ./
        continue-on-error: true
        with:
          release-base-url: http://127.0.0.1:8765
          feed: org/feed
          purpose: docker-build
          secret-id: packagemaze_npm_Admin

      - name: Check Docker secret id validation rejects uppercase custom ids
        env:
          OUTCOME: ${{ steps.invalid_docker_upper_custom_secret_id.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure"

      - id: invalid_docker_missing_metadata
        uses: ./
        continue-on-error: true
        with:
          release-base-url: http://127.0.0.1:8765
          feed: org/missing-metadata
          purpose: docker-build

      - name: Check Docker metadata validation requires feed base URL
        env:
          OUTCOME: ${{ steps.invalid_docker_missing_metadata.outcome }}
          SECRET_ARGS: ${{ steps.invalid_docker_missing_metadata.outputs.secret_args }}
          SECRET_FILES: ${{ steps.invalid_docker_missing_metadata.outputs.secret_files }}
          SECRET_ID: ${{ steps.invalid_docker_missing_metadata.outputs.secret_id }}
          SECRET_PATH: ${{ steps.invalid_docker_missing_metadata.outputs.secret_path }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure"
          test -z "$SECRET_ARGS"
          test -z "$SECRET_FILES"
          test -z "$SECRET_ID"
          test -z "$SECRET_PATH"

      - id: invalid_docker_absent_metadata
        uses: ./
        continue-on-error: true
        with:
          release-base-url: http://127.0.0.1:8765
          feed: org/old-cli
          purpose: docker-build

      - name: Check Docker metadata validation handles absent old CLI metadata
        env:
          OUTCOME: ${{ steps.invalid_docker_absent_metadata.outcome }}
          SECRET_ARGS: ${{ steps.invalid_docker_absent_metadata.outputs.secret_args }}
          SECRET_FILES: ${{ steps.invalid_docker_absent_metadata.outputs.secret_files }}
          SECRET_ID: ${{ steps.invalid_docker_absent_metadata.outputs.secret_id }}
          SECRET_PATH: ${{ steps.invalid_docker_absent_metadata.outputs.secret_path }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure"
          test -z "$SECRET_ARGS"
          test -z "$SECRET_FILES"
          test -z "$SECRET_ID"
          test -z "$SECRET_PATH"

      - id: invalid_docker_unsupported_protocol
        uses: ./
        continue-on-error: true
        with:
          release-base-url: http://127.0.0.1:8765
          feed: org/unsupported
          purpose: docker-build

      - name: Check Docker metadata validation rejects unsupported protocols
        env:
          OUTCOME: ${{ steps.invalid_docker_unsupported_protocol.outcome }}
          SECRET_ARGS: ${{ steps.invalid_docker_unsupported_protocol.outputs.secret_args }}
          SECRET_FILES: ${{ steps.invalid_docker_unsupported_protocol.outputs.secret_files }}
          SECRET_ID: ${{ steps.invalid_docker_unsupported_protocol.outputs.secret_id }}
          SECRET_PATH: ${{ steps.invalid_docker_unsupported_protocol.outputs.secret_path }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure"
          test -z "$SECRET_ARGS"
          test -z "$SECRET_FILES"
          test -z "$SECRET_ID"
          test -z "$SECRET_PATH"

      - name: Create npm Docker smoke file
        run: |
          cat > Dockerfile.packagemaze-npm-smoke <<'DOCKERFILE'
          # syntax=docker/dockerfile:1.7
          FROM alpine:3.20
          RUN --mount=type=secret,id=packagemaze_npm \
              . /run/secrets/packagemaze_npm && \
              test -z "${MAZE_TOKEN:-}" && \
              test -f "$NPM_CONFIG_USERCONFIG" && \
              grep -q "registry=https://pkg.packagemaze.com/org/feed/" "$NPM_CONFIG_USERCONFIG" && \
              grep -q "fake-docker-token" "$NPM_CONFIG_USERCONFIG" && \
              test "$COREPACK_NPM_REGISTRY" = "https://pkg.packagemaze.com/org/feed/" && \
              test -z "${COREPACK_NPM_TOKEN:-}"
          DOCKERFILE

      - name: Build npm Docker smoke with secret-files
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.packagemaze-npm-smoke
          secret-files: ${{ steps.docker_token.outputs.secret_files }}

      - id: docker_admin_token
        uses: ./
        with:
          release-base-url: http://127.0.0.1:8765
          feed: org/admin
          purpose: docker-build
          secret-id: packagemaze_npm_admin

      - name: Check custom Docker secret id output
        env:
          SECRET_FILES: ${{ steps.docker_admin_token.outputs.secret_files }}
          SECRET_ID: ${{ steps.docker_admin_token.outputs.secret_id }}
          SECRET_PATH: ${{ steps.docker_admin_token.outputs.secret_path }}
        run: |
          set -euo pipefail
          test "$SECRET_ID" = "packagemaze_npm_admin"
          test "${SECRET_FILES#packagemaze_npm_admin=}" = "$SECRET_PATH"
          grep -q "registry=https://pkg.packagemaze.com/org/admin/" "$SECRET_PATH"

      - id: docker_pypi_token
        uses: ./
        with:
          release-base-url: http://127.0.0.1:8765
          feed: org/pypi
          purpose: docker-build

      - name: Check Docker PyPI secret outputs
        env:
          SECRET_ARGS: ${{ steps.docker_pypi_token.outputs.secret_args }}
          SECRET_FILES: ${{ steps.docker_pypi_token.outputs.secret_files }}
          SECRET_ID: ${{ steps.docker_pypi_token.outputs.secret_id }}
          SECRET_PATH: ${{ steps.docker_pypi_token.outputs.secret_path }}
          TOKEN: ${{ steps.docker_pypi_token.outputs.token }}
        run: |
          set -euo pipefail
          test -z "$TOKEN"
          test "$SECRET_ID" = "packagemaze_pypi"
          test -n "$SECRET_ARGS"
          test -f "$SECRET_PATH"
          test "${SECRET_FILES#packagemaze_pypi=}" = "$SECRET_PATH"
          grep -q "fake-pypi-docker-token" "$SECRET_PATH"
          grep -q "PACKAGEMAZE_PYPI_INDEX_SCHEME='http'" "$SECRET_PATH"
          ! grep -q "MAZE_TOKEN" "$SECRET_PATH"
          ! grep -q "UV_INDEX_PACKAGEMAZE_PASSWORD" "$SECRET_PATH"
          ! grep -q "POETRY_HTTP_BASIC_PACKAGEMAZE_PASSWORD" "$SECRET_PATH"
          (
            . "$SECRET_PATH"
            test -z "${MAZE_TOKEN:-}"
            test -z "${PACKAGEMAZE_PYPI_TOKEN:-}"
            test "$PACKAGEMAZE_PYPI_INDEX_SCHEME" = "http"
            test -f "$PIP_CONFIG_FILE"
            grep -q "pkg.packagemaze.test/org/pypi/simple/" "$PIP_CONFIG_FILE"
            case "$PIP_INDEX_URL" in
              http://__token__:*@pkg.packagemaze.test/org/pypi/simple/) ;;
              *) exit 1 ;;
            esac
            test "$UV_INDEX_URL" = "$PIP_INDEX_URL"
          )

      - name: Create PyPI Docker smoke file
        run: |
          cat > Dockerfile.packagemaze-pypi-smoke <<'DOCKERFILE'
          # syntax=docker/dockerfile:1.7
          FROM alpine:3.20
          RUN --mount=type=secret,id=packagemaze_pypi \
              . /run/secrets/packagemaze_pypi && \
              test -z "${MAZE_TOKEN:-}" && \
              test -z "${PACKAGEMAZE_PYPI_TOKEN:-}" && \
              test "$PACKAGEMAZE_PYPI_INDEX_SCHEME" = "http" && \
              test -f "$PIP_CONFIG_FILE" && \
              grep -q "pkg.packagemaze.test/org/pypi/simple/" "$PIP_CONFIG_FILE" && \
              test "$UV_INDEX_URL" = "$PIP_INDEX_URL"
          DOCKERFILE

      - name: Build PyPI Docker smoke with secret_args
        run: docker buildx build ${{ steps.docker_pypi_token.outputs.secret_args }} -f Dockerfile.packagemaze-pypi-smoke .

      - name: Create multi-feed Docker smoke file
        run: |
          cat > Dockerfile.packagemaze-multi-smoke <<'DOCKERFILE'
          # syntax=docker/dockerfile:1.7
          FROM alpine:3.20
          RUN --mount=type=secret,id=packagemaze_npm \
              --mount=type=secret,id=packagemaze_pypi \
              . /run/secrets/packagemaze_npm && \
              . /run/secrets/packagemaze_pypi && \
              test -f "$NPM_CONFIG_USERCONFIG" && \
              test -f "$PIP_CONFIG_FILE" && \
              grep -q "fake-docker-token" "$NPM_CONFIG_USERCONFIG" && \
              grep -q "fake-pypi-docker-token" "$PIP_CONFIG_FILE"
          RUN if grep -R "fake-docker-token" /tmp 2>/dev/null; then exit 1; fi && \
              if grep -R "fake-pypi-docker-token" /tmp 2>/dev/null; then exit 1; fi
          DOCKERFILE

      - name: Build multi-feed Docker smoke with secret-files
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.packagemaze-multi-smoke
          secret-files: |
            ${{ steps.docker_token.outputs.secret_files }}
            ${{ steps.docker_pypi_token.outputs.secret_files }}

      - name: Check action avoids Bash 4-only lowercase expansion
        run: |
          set -euo pipefail
          ! grep -n '\${[^}]*,,}' action.yml

      - name: Check setup invocation contract
        run: |
          set -euo pipefail
          request_log="${RUNNER_TEMP}/maze-exchange-requests.tsv"
          test -f "$request_log"
          test "$(wc -l < "$request_log" | tr -d '[:space:]')" = "15"
          cut -f1 "$request_log" | grep -Eq '^setup-maze_[0-9a-f]{32}$'
          test "$(cut -f1 "$request_log" | sort -u | wc -l | tr -d '[:space:]')" = "15"
          test "$(grep -c -- '--setup-invocation-id' "$request_log" || true)" = "0"

      - name: Check default CLI contract version
        run: |
          ruby -ryaml -e '
            action = YAML.safe_load(File.read("action.yml"))
            abort "unexpected default maze version" unless action.dig("inputs", "version", "default") == "v0.0.4"
          '

      - id: invalid_package
        uses: ./
        continue-on-error: true
        with:
          release-base-url: http://127.0.0.1:8765
          feed: org/feed
          package: "@scope/package"

      - name: Check package validation
        env:
          OUTCOME: ${{ steps.invalid_package.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure"

      - id: invalid_secret_id
        uses: ./
        continue-on-error: true
        with:
          release-base-url: http://127.0.0.1:8765
          feed: org/feed
          secret-id: packagemaze_npm

      - name: Check secret-id validation
        env:
          OUTCOME: ${{ steps.invalid_secret_id.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure"

      - uses: ./
        with:
          release-base-url: http://127.0.0.1:8765

      - name: Smoke release install
        run: maze auth exchange-oidc --help

      - name: Stop fake release server
        if: always()
        run: |
          if [ -f fake-release-server.pid ]; then
            kill "$(cat fake-release-server.pid)" || true
          fi
